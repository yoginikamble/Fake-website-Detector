# Optional: Render Blueprint to host the Flask app (free plan).
services:
  - type: web
    name: fake-website-detector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
